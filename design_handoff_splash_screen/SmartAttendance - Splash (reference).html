<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttendance — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2F5BFF; --violet:#7E5BFF; --blue:#4470FF;
    --ink:#0E1326;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    padding:48px 24px;
    background:
      radial-gradient(120% 90% at 82% -10%, #F1ECFB 0%, transparent 55%),
      radial-gradient(120% 90% at -10% 0%, #E6EEFF 0%, transparent 50%),
      #EAEDF6;
    font-family:var(--body);
  }

  /* ── phone shell ─────────────────────────────────────────── */
  .phone{
    width:392px; height:840px; flex-shrink:0;
    border-radius:60px; padding:13px;
    background:linear-gradient(155deg,#23262E 0%,#0C0D11 60%,#05060A 100%);
    box-shadow:
      0 2px 3px rgba(255,255,255,.35) inset,
      0 60px 120px -50px rgba(20,16,60,.62),
      0 30px 60px -40px rgba(12,10,40,.5),
      0 0 0 1px rgba(0,0,0,.05);
    position:relative;
  }
  .screen{
    position:relative; width:100%; height:100%;
    border-radius:48px; overflow:hidden;
    background:
      radial-gradient(125% 80% at 32% 12%, #2A356A 0%, #1B2350 34%, #121A3C 64%, #0A0E22 100%);
  }
  /* faint violet bloom + grain-free vignette */
  .screen::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(70% 50% at 50% 38%, rgba(126,91,255,.22) 0%, transparent 62%),
      radial-gradient(120% 80% at 50% 116%, rgba(0,0,0,.55) 0%, transparent 55%);
    pointer-events:none;
  }
  .island{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    width:118px; height:33px; background:#05060B; border-radius:18px; z-index:9;
  }
  .statusbar{
    position:absolute; top:20px; left:0; right:0; z-index:8;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; color:#fff; font-weight:700; font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .statusbar .right{display:flex; align-items:center; gap:7px; opacity:.95}

  /* ── splash content ──────────────────────────────────────── */
  .splash{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .mark{
    position:relative;
    opacity:0; transform:scale(.92);
    animation:markIn 1s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  .mark .halo{
    position:absolute; inset:-34%; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(110,91,255,.45) 0%, transparent 60%);
    filter:blur(8px);
    opacity:0; animation:haloIn 1.4s ease-out .5s forwards;
  }
  .mark svg{display:block; filter:drop-shadow(0 30px 44px rgba(8,6,30,.55))}

  /* stroke draw-in for the four scan brackets */
  .brk{
    stroke-dasharray:100; stroke-dashoffset:100;
    animation:draw 1.05s cubic-bezier(.7,0,.2,1) .35s forwards;
  }
  /* scan sweep */
  .scan{
    opacity:0;
    animation:scanSweep 1.5s cubic-bezier(.5,0,.5,1) .55s 2;
  }
  /* face */
  .eye{transform-box:fill-box; transform-origin:center; transform:scale(0); 
       animation:pop .5s cubic-bezier(.34,1.6,.5,1) 1.18s forwards;}
  .eye.r{animation-delay:1.26s}
  .smile{stroke-dasharray:100; stroke-dashoffset:100;
         animation:draw .55s cubic-bezier(.6,0,.3,1) 1.34s forwards;}

  .wordmark{
    margin-top:46px; text-align:center;
    opacity:0; transform:translateY(14px);
    animation:rise .9s cubic-bezier(.22,1,.36,1) 1.5s forwards;
  }
  .wordmark h1{
    font-family:var(--display); font-weight:700; font-size:33px; letter-spacing:-.018em;
    color:#fff; line-height:1;
  }
  .wordmark h1 .a{color:#B9A5FF}
  .wordmark p{
    margin-top:13px; font-size:13.5px; font-weight:500; letter-spacing:.01em;
    color:rgba(255,255,255,.6);
  }

  /* bottom progress + footer */
  .foot{
    position:absolute; left:0; right:0; bottom:52px; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    opacity:0; animation:rise .9s ease-out 1.8s forwards;
  }
  .track{width:128px; height:3px; border-radius:3px; background:rgba(255,255,255,.14); overflow:hidden}
  .track i{
    display:block; height:100%; width:40%; border-radius:3px;
    background:linear-gradient(90deg,var(--blue),var(--violet));
    transform:translateX(-120%);
    animation:load 1.5s cubic-bezier(.65,0,.35,1) 1.95s infinite;
  }
  .brandline{
    display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.42);
  }
  .brandline .dot{width:5px; height:5px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--violet));}

  @keyframes markIn{to{opacity:1; transform:scale(1)}}
  @keyframes haloIn{0%{opacity:0} 60%{opacity:1} 100%{opacity:.85}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}
  @keyframes scanSweep{
    0%{opacity:0; transform:translateY(-180px)}
    12%{opacity:1}
    88%{opacity:1}
    100%{opacity:0; transform:translateY(180px)}
  }
  @keyframes load{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(420%)}
  }
  @media (prefers-reduced-motion:reduce){
    .mark,.halo,.brk,.scan,.eye,.smile,.wordmark,.foot,.track i{animation:none !important}
    .mark{opacity:1;transform:none} .brk,.smile{stroke-dashoffset:0}
    .eye{transform:scale(1)} .wordmark,.foot{opacity:1;transform:none} .scan{display:none}
  }

  /* ── replay control ──────────────────────────────────────── */
  .replay{
    display:inline-flex; align-items:center; gap:9px;
    height:44px; padding:0 20px; border-radius:14px;
    border:1px solid rgba(14,19,38,.1); background:#fff; cursor:pointer;
    font-family:var(--body); font-weight:700; font-size:13.5px; color:var(--ink);
    box-shadow:0 12px 28px -18px rgba(20,30,70,.4);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .replay:hover{transform:translateY(-1px); box-shadow:0 16px 34px -18px rgba(20,30,70,.5)}
  .replay:active{transform:scale(.97)}
  .replay svg{display:block}
</style>
</head>
<body>

  <div class="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 9.6 8.5 9.6M2 4.2a9 9 0 0 1 13 0M4.6 6.6a5.4 5.4 0 0 1 7.8 0M8.5 9.2h.01" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.3" opacity=".55"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="#fff"/><rect x="23.5" y="4" width="1.6" height="4" rx="1" fill="#fff" opacity=".55"/></svg>
        </span>
      </div>

      <div class="splash">
        <div class="mark" id="mark">
          <div class="halo"></div>
          <!-- icon mark built on the 1024 grid, scaled to 132px -->
          <svg width="132" height="132" viewBox="0 0 1024 1024" role="img" aria-label="SmartAttendance">
            <defs>
              <linearGradient id="brg" x1="0.1" y1="0" x2="0.9" y2="1">
                <stop offset="0" stop-color="#4470FF"/>
                <stop offset="1" stop-color="#7E5BFF"/>
              </linearGradient>
              <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8FA9FF" stop-opacity="0"/>
                <stop offset="0.5" stop-color="#9FB4FF" stop-opacity=".95"/>
                <stop offset="1" stop-color="#8FA9FF" stop-opacity="0"/>
              </linearGradient>
              <clipPath id="frameClip"><rect x="298" y="298" width="428" height="428"/></clipPath>
            </defs>

            <!-- scan sweep, clipped to the frame interior -->
            <g clip-path="url(#frameClip)">
              <rect class="scan" x="298" y="350" width="428" height="20" rx="10" fill="url(#scanG)"/>
            </g>

            <!-- four scan brackets -->
            <path class="brk" pathLength="100"
              d="M 300 458 L 300 396 Q 300 300 396 300 L 458 300
                 M 724 458 L 724 396 Q 724 300 628 300 L 566 300
                 M 300 566 L 300 628 Q 300 724 396 724 L 458 724
                 M 724 566 L 724 628 Q 724 724 628 724 L 566 724"
              fill="none" stroke="url(#brg)" stroke-width="54"
              stroke-linecap="round" stroke-linejoin="round"/>

            <!-- face -->
            <circle class="eye l" cx="464" cy="486" r="27" fill="#fff"/>
            <circle class="eye r" cx="560" cy="486" r="27" fill="#fff"/>
            <path class="smile" pathLength="100" d="M 452 552 Q 512 608 572 552"
              fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="wordmark">
          <h1>Smart<span class="a">Attendance</span></h1>
          <p>Pointage par reconnaissance faciale</p>
        </div>
      </div>

      <div class="foot">
        <div class="track"><i></i></div>
        <div class="brandline"><span class="dot"></span>Présence, simplifiée</div>
      </div>
    </div>
  </div>

  <button class="replay" id="replay" aria-label="Rejouer l'animation">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 8.5a8 8 0 0 0-13.7-2.3L3.5 9M3.5 4.5V9h4.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15.5a8 8 0 0 0 13.7 2.3L20.5 15M20.5 19.5V15H16" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></svg>
    Rejouer
  </button>

  <script>
    document.getElementById('replay').addEventListener('click', () => {
      const cur = document.getElementById('screen');
      const clone = cur.cloneNode(true);   // fresh node restarts every CSS animation
      clone.id = 'screen';
      cur.parentNode.replaceChild(clone, cur);
    });
  </script>
</body>
</html>
