<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartAttendance — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0e1a; overflow: hidden; }
  #root { height: 100%; }
  button { font: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes sa-rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sa-rise { animation: sa-rise .4s cubic-bezier(.2,.8,.2,1) both; }

  @keyframes sa-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .sa-pop { animation: sa-pop .5s cubic-bezier(.2,1.3,.4,1) both; }

  /* feed item stagger-in */
  @keyframes sa-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .sa-fade { animation: sa-fade .45s cubic-bezier(.2,.8,.2,1) both; }

  /* collapse when an "à traiter" card is handled */
  .sa-collapse { animation: sa-collapse .42s cubic-bezier(.4,0,.2,1) forwards; overflow: hidden; }
  @keyframes sa-collapse {
    0%   { opacity: 1; max-height: 220px; transform: translateX(0); }
    40%  { opacity: 0; transform: translateX(36px); max-height: 220px; }
    100% { opacity: 0; max-height: 0; margin-top: -12px; transform: translateX(36px); padding-top: 0; padding-bottom: 0; }
  }

  @keyframes sa-shimmer { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sa-dot-live { animation: sa-shimmer 1.8s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .sa-rise, .sa-pop, .sa-fade, .sa-collapse, .sa-dot-live { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="notif-app.jsx"></script>
</body>
</html>
