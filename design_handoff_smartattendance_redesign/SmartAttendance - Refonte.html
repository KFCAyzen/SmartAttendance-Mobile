<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartAttendance — Refonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0e1a; overflow: hidden; }
  #root { height: 100%; }
  button { font: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ── Face check-in animations ── */
  @keyframes sa-sweep {
    0%   { top: -10%; opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
  .sa-sweep { animation: sa-sweep 1.4s cubic-bezier(.45,0,.55,1) infinite; }

  @keyframes sa-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }
  .sa-pulse { animation: sa-pulse 1.6s ease-in-out infinite; }

  @keyframes sa-spin { to { transform: rotate(360deg); } }
  .sa-spin { animation: sa-spin .8s linear infinite; }

  @keyframes sa-pop {
    0%   { transform: scale(0.6); }
    60%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .sa-pop { animation: sa-pop .5s cubic-bezier(.2,1.3,.4,1) both; }

  @keyframes sa-rise {
    from { transform: translateY(14px); }
    to   { transform: translateY(0); }
  }
  .sa-rise { animation: sa-rise .35s cubic-bezier(.2,.8,.2,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .sa-sweep, .sa-pulse, .sa-spin, .sa-pop, .sa-rise { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
